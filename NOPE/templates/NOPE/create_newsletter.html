{% extends 'NOPE/base.html' %}

{% block content %}
<div class="card">
    <h1>Create Newsletter</h1>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label for="title" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Title:</label>
            <input type="text" id="title" name="title" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="description" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Description:</label>
            <textarea id="description" name="description" rows="4" required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;"></textarea>
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Add Articles:</label>
            <div style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 0.5rem;">
                {% for article in approved_articles %}
                <label style="display: flex; align-items: flex-start; padding: 0.5rem; border-bottom: 1px solid #f0f0f0; cursor: pointer;">
                    <input type="checkbox" name="articles" value="{{ article.id }}" style="margin-right: 0.75rem; margin-top: 0.2rem;">
                    <span>
                        <strong>{{ article.title }}</strong><br>
                        <small style="color: #666;">By {{ article.author.get_full_name|default:article.author.username }} · {{ article.created_at|date:"M d, Y" }}</small>
                    </span>
                </label>
                {% empty %}
                <p style="padding: 0.5rem; color: #666;">No approved articles available.</p>
                {% endfor %}
            </div>
        </div>

        <div style="margin-bottom: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 4px; border-left: 4px solid #3498db;">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" name="published" style="margin-right: 0.5rem; width: 18px; height: 18px;">
                <span style="font-weight: bold;">Publish immediately</span>
            </label>
            <p style="margin: 0.5rem 0 0 1.5rem; color: #666; font-size: 0.9rem;">Leave unchecked to save as a draft.</p>
        </div>

        <div style="margin-top: 1rem;">
            <button type="submit" class="btn btn-primary">Create Newsletter</button>
            <a href="{% url 'newsletter_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
